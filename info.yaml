# Tiny Tapeout project information
project:
  title: "TT-RANDOM-ALU-4"
  author: "Erik Paucar"
  discord: ""
  description: "4-bit ALU, 4-bit LFSR pseudo-random generator, and four-state FSM controller."
  language: "Verilog"
  clock_hz: 0

  # Target one tile. Actual fit must be confirmed by the GF180 synthesis flow.
  tiles: "1x1"

  top_module: "tt_um_random_alu_4"

  source_files:
    - "project.v"

# Pin names describe the external interface.
# ui_in[7:4] = operand A; ui_in[3:0] = operand B / LFSR seed.
# uio pins are used as command inputs, then driven during the DONE state.
pinout:
  ui[0]: "B0_SEED0"
  ui[1]: "B1_SEED1"
  ui[2]: "B2_SEED2"
  ui[3]: "B3_SEED3"
  ui[4]: "A0"
  ui[5]: "A1"
  ui[6]: "A2"
  ui[7]: "A3"

  uo[0]: "RESULT0"
  uo[1]: "RESULT1"
  uo[2]: "RESULT2"
  uo[3]: "RESULT3"
  uo[4]: "CARRY"
  uo[5]: "ZERO"
  uo[6]: "FSM_STATE0"
  uo[7]: "FSM_STATE1"

  uio[0]: "OPCODE0_OVF"
  uio[1]: "OPCODE1_NEG"
  uio[2]: "OPCODE2_RESERVED"
  uio[3]: "OPCODE3_RESERVED"
  uio[4]: "MODE"
  uio[5]: "START"
  uio[6]: "SEED_LOAD"
  uio[7]: "LFSR_STEP"

yaml_version: 6
